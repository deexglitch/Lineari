<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Employee table</title>
  <desc id="d">The employee table with a self-referencing manager_id foreign key and its database constraints.</desc>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B6D777"/><stop offset="1" stop-color="#D5E3DF"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B6D777"/></marker>
  </defs>
  <style>
    text{font-family:Manrope,Quicksand,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .c{font-size:14px;font-weight:600;fill:#FFFFFF}
    .ty{font-size:12px;fill:#A9BDB8}
    .tag{font-size:10px;font-weight:700;fill:#2B1D3A}
    .row{stroke:#4A3A60;stroke-width:1}
  </style>
  <rect width="860" height="400" rx="18" fill="#2B1D3A"/>

  <!-- table -->
  <rect x="50" y="30" width="430" height="350" rx="14" fill="#382849" stroke="#5A4873" stroke-width="1.5"/>
  <path d="M50 44 a14 14 0 0 1 14 -14 H466 a14 14 0 0 1 14 14 V74 H50z" fill="url(#ac)"/>
  <text x="72" y="58" font-size="17" font-weight="800" fill="#2B1D3A" class="m">employee</text>

  <g class="row"><path d="M50 114H480M50 152H480M50 190H480M50 228H480M50 266H480M50 304H480"/></g>
  <g class="c m">
    <text x="72" y="98">id</text>
    <text x="72" y="136">emp_number</text>
    <text x="72" y="174">email</text>
    <text x="72" y="212">birth_date</text>
    <text x="72" y="250">salary</text>
    <text x="72" y="288">manager_id</text>
    <text x="72" y="326" fill="#A9BDB8" font-weight="400">…profile fields</text>
  </g>
  <g class="ty m">
    <text x="220" y="98">UUID</text><text x="220" y="136">text</text><text x="220" y="174">text</text>
    <text x="220" y="212">date</text><text x="220" y="250">numeric</text><text x="220" y="288">UUID · nullable</text>
  </g>
  <!-- tags -->
  <g>
    <rect x="395" y="84" width="62" height="20" rx="10" fill="#F2674A"/><text class="tag" x="426" y="98" text-anchor="middle">PRIMARY</text>
    <rect x="395" y="122" width="62" height="20" rx="10" fill="#B6D777"/><text class="tag" x="426" y="136" text-anchor="middle">UNIQUE</text>
    <rect x="368" y="160" width="89" height="20" rx="10" fill="#B6D777"/><text class="tag" x="412" y="174" text-anchor="middle">UNIQUE · ci</text>
    <rect x="378" y="198" width="79" height="20" rx="10" fill="#D5E3DF"/><text class="tag" x="417" y="212" text-anchor="middle">IN THE PAST</text>
    <rect x="395" y="236" width="62" height="20" rx="10" fill="#D5E3DF"/><text class="tag" x="426" y="250" text-anchor="middle">≥ 0</text>
    <rect x="410" y="274" width="47" height="20" rx="10" fill="#B6D777"/><text class="tag" x="433" y="288" text-anchor="middle">FK</text>
  </g>

  <!-- self reference -->
  <path d="M480 284 H520 V94 H484" fill="none" stroke="#B6D777" stroke-width="2" marker-end="url(#a)"/>
  <text x="536" y="190" font-size="12" font-weight="700" fill="#B6D777">manager_id → id</text>
  <text x="536" y="208" font-size="11" fill="#A9BDB8">self-reference</text>
  <text x="536" y="224" font-size="11" fill="#A9BDB8">ON DELETE RESTRICT</text>

  <!-- constraints -->
  <g transform="translate(536 40)">
    <rect width="290" height="60" rx="10" fill="#382849" stroke="#5A4873"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#B6D777">CHECK · no self-management</text>
    <text x="14" y="44" class="m" font-size="12" fill="#D5E3DF">manager_id IS NULL OR manager_id &lt;&gt; id</text>
  </g>
  <g transform="translate(536 262)">
    <rect width="290" height="52" rx="10" fill="#382849" stroke="#5A4873"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#B6D777">CHECK · non-negative pay</text>
    <text x="14" y="42" class="m" font-size="12" fill="#D5E3DF">salary &gt;= 0</text>
  </g>
  <g transform="translate(536 326)">
    <rect width="290" height="40" rx="10" fill="#382849" stroke="#5A4873"/>
    <text x="14" y="25" font-size="12" fill="#D5E3DF">Cycles are blocked by a recursive CTE.</text>
  </g>
</svg>

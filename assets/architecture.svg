<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Lineari architecture</title>
  <desc id="d">The OpenAPI contract generates frontend types and drives the backend schemas. The React app talks to FastAPI over HTTP, which talks to PostgreSQL.</desc>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B6D777"/><stop offset="1" stop-color="#D5E3DF"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A9BDB8"/></marker>
  </defs>
  <style>
    text{font-family:Manrope,Quicksand,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .t{font-family:Quicksand,Manrope,sans-serif;font-size:16px;font-weight:700;fill:#FFFFFF}
    .s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#A9BDB8}
    .l{font-size:12px;fill:#B6D777;font-weight:600}
    .box{fill:#382849;stroke:#5A4873;stroke-width:1.5}
    .ln{fill:none;stroke:#A9BDB8;stroke-width:1.8}
  </style>
  <rect width="1000" height="530" rx="18" fill="#2B1D3A"/>

  <!-- contract -->
  <rect x="380" y="30" width="240" height="70" rx="14" fill="#382849" stroke="url(#ac)" stroke-width="2.5"/>
  <text class="t" x="500" y="58" text-anchor="middle">OpenAPI contract</text>
  <text class="s" x="500" y="80" text-anchor="middle">contract/openapi.yaml</text>
  <text class="l" x="500" y="20" text-anchor="middle">SOURCE OF TRUTH</text>

  <!-- arrows from contract -->
  <path class="ln" marker-end="url(#a)" d="M430 100 C430 130 180 120 180 150"/>
  <path class="ln" marker-end="url(#a)" d="M570 100 C570 130 820 120 820 150" stroke-dasharray="6 5"/>
  <text class="l" x="300" y="146" text-anchor="middle">just types</text>
  <text class="l" x="700" y="146" text-anchor="middle">implement to match</text>

  <!-- row B -->
  <rect class="box" x="60" y="150" width="240" height="70" rx="12"/>
  <text class="t" x="180" y="178" text-anchor="middle">Generated types</text>
  <text class="s" x="180" y="200" text-anchor="middle">web/src/api/schema.d.ts</text>
  <rect class="box" x="700" y="150" width="240" height="70" rx="12"/>
  <text class="t" x="820" y="178" text-anchor="middle">Pydantic schemas</text>
  <text class="s" x="820" y="200" text-anchor="middle">api/app/schemas.py</text>

  <path class="ln" marker-end="url(#a)" d="M180 220 V290"/>
  <path class="ln" marker-end="url(#a)" d="M820 220 V290"/>

  <!-- row C -->
  <rect class="box" x="60" y="290" width="240" height="70" rx="12"/>
  <text class="t" x="180" y="318" text-anchor="middle">React SPA</text>
  <text class="s" x="180" y="340" text-anchor="middle">TanStack Query · openapi-fetch</text>
  <rect class="box" x="700" y="290" width="240" height="70" rx="12"/>
  <text class="t" x="820" y="318" text-anchor="middle">FastAPI</text>
  <text class="s" x="820" y="340" text-anchor="middle">routers · SQLAlchemy 2</text>

  <path class="ln" marker-start="url(#a)" marker-end="url(#a)" d="M300 325 H700"/>
  <text class="l" x="500" y="314" text-anchor="middle">HTTP · JSON</text>
  <text class="s" x="500" y="347" text-anchor="middle">{ code, message } errors</text>

  <!-- row D -->
  <path class="ln" marker-end="url(#a)" d="M820 360 V430"/>
  <text class="l" x="834" y="400">psycopg 3 · Alembic</text>
  <rect class="box" x="700" y="430" width="240" height="70" rx="12"/>
  <text class="t" x="820" y="458" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="820" y="480" text-anchor="middle">UUID PKs · gen_random_uuid()</text>

  <!-- legend -->
  <g transform="translate(60 440)">
    <path class="ln" d="M0 10 H36" marker-end="url(#a)"/><text class="s" x="48" y="14">generated / data flow</text>
    <path class="ln" d="M0 38 H36" stroke-dasharray="6 5" marker-end="url(#a)"/><text class="s" x="48" y="42">manual, guided by the contract</text>
  </g>
</svg>

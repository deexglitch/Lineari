<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Organisation chart preview</title>
  <desc id="d">An illustrative nested hierarchy with search, expand and collapse controls and a level count.</desc>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B6D777"/><stop offset="1" stop-color="#D5E3DF"/></linearGradient>
  </defs>
  <style>
    text{font-family:Manrope,Quicksand,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .n{font-size:13px;font-weight:700;fill:#FFFFFF}
    .r{font-size:11px;fill:#A9BDB8}
    .card{fill:#382849;stroke:#5A4873;stroke-width:1.5}
    .ln{fill:none;stroke:#0B6E6A;stroke-width:2}
  </style>
  <rect width="900" height="430" rx="18" fill="#2B1D3A"/>

  <!-- toolbar -->
  <rect x="30" y="22" width="260" height="34" rx="17" fill="#382849" stroke="#5A4873"/>
  <circle cx="52" cy="39" r="6" fill="none" stroke="#A9BDB8" stroke-width="2"/><path d="M57 44 l5 5" stroke="#A9BDB8" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="43" class="r" font-size="13">Search the organisation…</text>
  <rect x="700" y="22" width="86" height="34" rx="17" fill="#382849" stroke="#5A4873"/>
  <text x="743" y="43" text-anchor="middle" class="r" font-size="12" fill="#D5E3DF">Expand all</text>
  <rect x="796" y="22" width="74" height="34" rx="17" fill="url(#ac)"/>
  <text x="833" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#2B1D3A">3 levels</text>

  <!-- connectors -->
  <g class="ln">
    <path d="M450 128 V150 M180 150 H720 M180 150 V178 M450 150 V178 M720 150 V178"/>
    <path d="M180 234 V256 M100 256 H260 M100 256 V284 M260 256 V284"/>
    <path d="M720 234 V256 M640 256 H800 M640 256 V284 M800 256 V284"/>
    <path d="M450 234 V284" stroke-dasharray="4 4" opacity=".6"/>
  </g>

  <!-- level 1 -->
  <g transform="translate(375 72)">
    <rect class="card" width="150" height="56" rx="12" stroke="url(#ac)" stroke-width="2"/>
    <circle cx="28" cy="28" r="14" fill="url(#ac)"/>
    <text class="n" x="52" y="25">Avery Stone</text><text class="r" x="52" y="42">Chief Executive</text>
  </g>
  <!-- level 2 -->
  <g transform="translate(105 178)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#0B6E6A"/><text class="n" x="52" y="25">Jordan Reyes</text><text class="r" x="52" y="42">VP Engineering</text><circle cx="75" cy="56" r="10" fill="#2B1D3A" stroke="#B6D777"/><path d="M70 56h10" stroke="#B6D777" stroke-width="2"/></g>
  <g transform="translate(375 178)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#F2674A"/><text class="n" x="52" y="25">Sam Okafor</text><text class="r" x="52" y="42">VP People</text><circle cx="75" cy="56" r="10" fill="#2B1D3A" stroke="#B6D777"/><path d="M70 56h10M75 51v10" stroke="#B6D777" stroke-width="2"/></g>
  <g transform="translate(645 178)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#B6D777"/><text class="n" x="52" y="25">Riley Chen</text><text class="r" x="52" y="42">VP Finance</text><circle cx="75" cy="56" r="10" fill="#2B1D3A" stroke="#B6D777"/><path d="M70 56h10" stroke="#B6D777" stroke-width="2"/></g>
  <!-- level 3 -->
  <g transform="translate(25 284)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#0B6E6A"/><text class="n" x="52" y="25">Taylor Brooks</text><text class="r" x="52" y="42">Staff Engineer</text></g>
  <g transform="translate(185 284)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#0B6E6A"/><text class="n" x="52" y="25">Morgan Lee</text><text class="r" x="52" y="42">Engineer</text></g>
  <g transform="translate(565 284)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#B6D777"/><text class="n" x="52" y="25">Casey Patel</text><text class="r" x="52" y="42">Controller</text></g>
  <g transform="translate(725 284)"><rect class="card" width="150" height="56" rx="12"/><circle cx="28" cy="28" r="14" fill="#B6D777"/><text class="n" x="52" y="25">Drew Silva</text><text class="r" x="52" y="42">Analyst</text></g>
  <!-- collapsed -->
  <g transform="translate(375 284)"><rect width="150" height="56" rx="12" fill="none" stroke="#0B6E6A" stroke-dasharray="5 4" stroke-width="1.5"/><text x="75" y="33" text-anchor="middle" class="r">+ 4 collapsed reports</text></g>

  <text x="450" y="395" text-anchor="middle" class="r" font-size="12">Illustrative data. The live chart is rendered by the organisation-tree component.</text>
</svg>
